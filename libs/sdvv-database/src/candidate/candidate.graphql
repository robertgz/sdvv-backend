
type Candidate {
  id: String!
  firstName: String
  lastName: String
  fullName: String

  # Details
  description: String
  imageUrl: String
  website: String

  jurisdictionName: String
  agency: String
  office: String
  district: String
  electionYear: String
  committeeName: String # @deprecated # use committee to determine the name
  inGeneralElection: Boolean
  inPrimaryElection: Boolean
  fullOfficeName: String
  "Finance data for a candidate committee"
  committee: Committee

  # outsideSpending: IndependentExpenditures
  independentExpenditures: IndependentExpenditures
}

# type FullName {
#   first: String
#   last: String
# }

input CandidateFilters {
  # names: [FullName]
  # agencyIds: [String]
  # elections: [String]
  # electionIds: [String]
  years: [String]
  offices: [String]
  districts: [String]
  inPrimaryElection: Boolean = false
  inGeneralElection: Boolean = false
}

type Query {
  candidate(id: String!): Candidate
  candidates(year: String @deprecated(reason: "Use `filters.years`."), filters: CandidateFilters): [Candidate]
}
